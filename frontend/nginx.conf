server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The browser only ever talks to this origin; /api is forwarded to the API gateway.
    # (A variable + resolver makes nginx look the gateway up at request time, so it can start before the gateway.)
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $gateway http://api-gateway:8080;
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # React Router: any other path serves the app, which then routes on the client
    location / {
        try_files $uri $uri/ /index.html;
    }
}
